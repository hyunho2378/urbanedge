<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UrbanEdge Kiosk" />
    <title>UrbanEdge Kiosk Simulator</title>
    <meta
      name="description"
      content="Try the UrbanEdge photo booth kiosk in your browser: the machine's real screen inside the machine's shell. GY-01 UrbanEdge Station, Hwangridan-gil, Gyeongju."
    />

    <!-- 파비콘과 앱 아이콘: 작업 B의 UE 심볼 세트(public/icons) -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/icons/manifest.webmanifest" />

    <!-- Open Graph. og:image와 og:url은 절대 URL이 필요하다. 배포 주소가 정해지면 아래 주석을 풀고 YOUR-DOMAIN을 바꾼다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UrbanEdge Metrography" />
    <meta property="og:title" content="UrbanEdge Kiosk Simulator" />
    <meta property="og:description" content="The photo booth screen inside the photo booth shell. Tap it, take the tour, or open it full screen." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <!-- <meta property="og:url" content="https://YOUR-DOMAIN/" /> -->
    <meta property="og:image" content="/icons/icon-512.png" />
    <!-- og:image는 크롤러가 읽으려면 절대 URL이어야 한다. 배포 주소가 정해지면 https://YOUR-DOMAIN/icons/icon-512.png로 바꾼다. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="UrbanEdge Kiosk Simulator" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>UrbanEdge Kiosk Simulator needs JavaScript. UrbanEdge Metrography, 6 Poseok-ro 1079beon-gil, Gyeongju.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
